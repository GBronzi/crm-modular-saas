services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-crm_app}:${POSTGRES_APP_PASSWORD:-local-dev-only-change-me}@postgres:5432/${POSTGRES_DB:-crm}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-secret-at-least-32-characters}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-crm_admin}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:-admin-local-change-me}
    volumes:
      - ./apps/api/db/migrations:/migrations:ro
      - ./infra/postgres/migrate.sh:/migrate.sh:ro
    command: ["sh", "/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-crm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-admin-local-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-crm_admin} -d ${POSTGRES_DB:-crm}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:

